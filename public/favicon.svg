<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Dark background -->
  <rect width="100" height="100" rx="20" fill="#060608"/>

  <!-- V - Left stroke -->
  <polygon points="15,17 37,83 29,83" fill="#ffffff"/>

  <!-- V - Right stroke / R - Stem -->
  <polygon points="37,83 45,83 58,37 50,37" fill="#ffffff"/>

  <!-- R - Top loop (bowl) -->
  <polygon points="50,37 75,37 75,57 50,57" fill="#ffffff"/>

  <!-- R - Leg (diagonal) -->
  <polygon points="50,57 60,57 72,77 62,77" fill="#ffffff"/>

  <!-- Cutout circle (eye of R) -->
  <circle cx="67" cy="47" r="5" fill="#060608"/>
</svg>
